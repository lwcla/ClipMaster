[versions]
agp = "9.1.0"
kotlin = "2.2.10"
refine = "4.4.0"
ksp = "2.3.2" # KSP 版本，与 Kotlin 版本对应

coreKtx = "1.17.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
lifecycleRuntimeKtx = "2.10.0"
activityCompose = "1.13.0"
composeBom = "2026.03.01"
appcompat = "1.7.1"
# Hilt与Jetpack Navigation Compose的集成库版本，提供hiltViewModel()函数
hiltNavigationCompose = "1.3.0"
constraintLayoutCompose = "1.1.1"

shizuku = "13.1.5"
hiddenApiBypass = "6.1"
# Room (数据库) 版本
room = "2.8.4"
# Hilt 版本
hilt = "2.59.2"
# Google ML Kit (OCR) 版本
mlkit = "16.0.1"
# Jsoup (HTML解析) 版本
jsoup = "1.22.1"
# Coil (图片加载) 版本
coil = "3.4.0"
# palette - 用于从图片中提取颜色信息，提供了Kotlin扩展函数，简化了使用流程
paletteKtx = "1.0.0"
# paging 版本 - 用于实现分页加载功能，特别适用于处理大量数据的列表，如聊天记录
paging_version = "3.4.2"
#okhttp
okhttp = "5.3.2"
codelocator = "2.0.4"
kontlinx-serialization-json = "1.11.0"
work = "2.11.2"
mmkv = "2.4.0"

[libraries]
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
# --- Jetpack Compose ---
# Compose BOM (Bill of Materials) 用于管理Jetpack Compose相关库的版本一致
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose" }
# 瀑布流
compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
# Jetpack Compose Material图标扩展库
# 包含了Material Design图标的完整集合
material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
# Hilt与Jetpack Navigation Compose的集成库
# 允许在Composable函数中通过 hiltViewModel() 轻松获取Hilt注入的ViewModel
hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltNavigationCompose" }
# constraintlayout
constraintlayout-compose = { group = "androidx.constraintlayout", name = "constraintlayout-compose", version.ref = "constraintLayoutCompose" }
# shizuku - 用于在非root环境下访问系统API
shizuku-api = { group = "dev.rikka.shizuku", name = "api", version.ref = "shizuku" }
shizuku-provider = { group = "dev.rikka.shizuku", name = "provider", version.ref = "shizuku" }
# 隐藏api绕过库 - 用于在Android 9及以上版本绕过隐藏API限制，允许访问更多系统功能
hideen-api-bypass = { group = "org.lsposed.hiddenapibypass", name = "hiddenapibypass", version.ref = "hiddenApiBypass" }
# Refine - 用于在编译时分析和优化代码，提供更好的性能和更小的APK体积
refine-annotation-processor = { group = "dev.rikka.tools.refine", name = "annotation-processor", version.ref = "refine" }
refine-annotation = { group = "dev.rikka.tools.refine", name = "annotation", version.ref = "refine" }
refine-runtime = { group = "dev.rikka.tools.refine", name = "runtime", version.ref = "refine" }
# --- Room 数据库 ---
# Room运行时库，提供了在设备上访问和管理SQLite数据库的接口
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
# Room的Kotlin扩展库，提供了对协程(Flow)和挂起函数的支持
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-paging = { group = "androidx.room", name = "room-paging", version.ref = "room" }
# Room的编译器，通过KSP在编译时生成DAO和数据库实现的模板代码
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
# --- Hilt 依赖注入 ---
# Hilt核心库，用于在Android类中注入依赖
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
# Hilt的编译器，通过KSP在编译时生成依赖注入所需的代码
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }
# Google ML Kit - 用于图片文字识别(OCR)，特别指定中文模型
mlkit-ocr = { group = "com.google.mlkit", name = "text-recognition-chinese", version.ref = "mlkit" }
# Jsoup - 用于解析HTML文档，实现URL链接预览功能
jsoup = { group = "org.jsoup", name = "jsoup", version.ref = "jsoup" }
# 图片加载
io-coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
io-coil-network-okhttp = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }
io-coil-gif = { group = "io.coil-kt.coil3", name = "coil-gif", version.ref = "coil" }
# palette - 用于从图片中提取颜色信息，提供了Kotlin扩展函数，简化了使用流程
androidx-palette-ktx = { group = "androidx.palette", name = "palette-ktx", version.ref = "paletteKtx" }
# paging - 用于实现分页加载功能，特别适用于处理大量数据的列表，如聊天记录
paging-runtime = { group = "androidx.paging", name = "paging-runtime", version.ref = "paging_version" }
paging-compose = { group = "androidx.paging", name = "paging-compose", version.ref = "paging_version" }
paging-common = { group = "androidx.paging", name = "paging-common", version.ref = "paging_version" }
#okhttp
okhttp-client = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-logger = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }
# codelocator，用于在调试时定位代码位置，提升调试效率 https://github.com/bytedance/CodeLocator
codelocator-core = { group = "com.bytedance.tools.codelocator", name = "codelocator-core", version.ref = "codelocator" }
#json
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kontlinx-serialization-json" }
#work
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }
androidx-hilt-work = { group = "androidx.hilt", name = "hilt-work", version.ref = "hiltNavigationCompose" }
androidx-hilt-compiler = { group = "androidx.hilt", name = "hilt-compiler", version.ref = "hiltNavigationCompose" }
#mmkv
mmkv = { group = "com.tencent", name = "mmkv", version.ref = "mmkv" }

[bundles]
compose = [
    "activity-compose",
    "compose-ui",
    "compose-ui-tooling-preview",
    "compose-material3",
    "compose-foundation",
    "material-icons-extended",
    "hilt-navigation-compose",
    "constraintlayout-compose",
    "androidx-navigation-compose"
]
compose-debug = ["compose-ui-tooling", "compose-ui-test-manifest"]
io-coil = ["io-coil-compose", "io-coil-network-okhttp", "io-coil-gif"]
shizuku = ["shizuku-api", "shizuku-provider"]
paging = ["paging-runtime", "paging-compose"]
room = ["room-runtime", "room-ktx", "room-paging"]
okhttp = ["okhttp-client", "okhttp-logger"]

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
android-library = { id = "com.android.library", version.ref = "agp" }
# refine 插件 - 用于在编译时分析和优化代码，提供更好的性能和更小的APK体积
refine = { id = "dev.rikka.tools.refine", version.ref = "refine" }
# KSP 用于 Room 和 Hilt
google-devtools-ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
#hilt 依赖注入插件
google-dagger-hilt-android = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
