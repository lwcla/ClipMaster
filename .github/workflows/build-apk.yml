name: 构建 Release APK

on:
  push:
    branches: [main] # 如果主分支叫 master，这里改成 master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: 获取代码
        uses: actions/checkout@v6

      - name: 配置 Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: 准备 Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '12266719'
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: 恢复正式签名
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_PROPERTIES_BASE64: ${{ secrets.RELEASE_PROPERTIES_BASE64 }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64"
          test -n "$RELEASE_PROPERTIES_BASE64"

          printf '%s' "$RELEASE_KEYSTORE_BASE64" \
            | base64 --decode > keystore.jks

          printf '%s' "$RELEASE_PROPERTIES_BASE64" \
            | base64 --decode > keystore.properties

      - name: 构建无广告 Release APK
        run: >-
          bash ./gradlew :app:assembleRelease
          --no-daemon
          -PenableAdmobDebugAdFeature=false
          -PenableAdmobReleaseAdFeature=false

      - name: 校验 APK 签名
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify \
            app/build/outputs/apk/release/*.apk

      - name: 上传 Release APK
        uses: actions/upload-artifact@v7
        with:
          name: ClipMaster-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: 保存 R8 混淆映射
        uses: actions/upload-artifact@v7
        with:
          name: ClipMaster-release-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 90
