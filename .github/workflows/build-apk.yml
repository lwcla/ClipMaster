name: 构建 APK

on:
  push:
    branches: [main] # 如果主分支叫 master，这里改成 master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: 获取代码
        uses: actions/checkout@v6

      - name: 配置 Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: 准备 Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: 恢复固定 Debug 签名
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          test -n "$DEBUG_KEYSTORE_BASE64"
          printf '%s' "$DEBUG_KEYSTORE_BASE64" \
            | base64 --decode > debug-internal.keystore

      - name: 构建无广告 Debug APK
        run: >-
          bash ./gradlew :app:assembleDebug
          --no-daemon
          -PenableAdmobDebugAdFeature=false
          -PenableAdmobReleaseAdFeature=false

      - name: 上传 APK
        uses: actions/upload-artifact@v7
        with:
          name: ClipMaster-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
